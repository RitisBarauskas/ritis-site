name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (Node ${{ matrix.node }})
    # Pinned image: it ships Google Chrome, which Playwright uses via channel 'chrome'.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22: the minimum in package.json "engines" (Astro's own floor); 24: what development and deploys run on.
        node: ['22', '24']
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Types and photo metadata
        run: npm run check

      - name: Browser tests on a fresh build
        run: npm test

      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-node-${{ matrix.node }}
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7
