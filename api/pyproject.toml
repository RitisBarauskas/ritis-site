[project]
name = "ritis-api"
version = "0.1.0"
description = "Backend for ritis.dev: bookings and payments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.29.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # import order
  "B",             # bugbear
  "UP",            # modern syntax
  "S",             # security (bandit)
  "SIM", "C4", "RET", "ARG",
  "N",             # naming
  "PT",            # pytest style
  "DTZ",           # timezone-aware datetimes only
  "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Tests use plain asserts and Flitt's public test secret ("test").
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not live"]
markers = ["live: calls Flitt's public test merchant over the network (run with -m live)"]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
